x-backend-common: &backend-common
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
  image: insightops-backend:0.1.0
  env_file:
    - .env
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: 8123
    AIRFLOW_API_BASE_URL: http://airflow-webserver:8080

x-airflow-image: &airflow-image
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: ${AIRFLOW_IMAGE_NAME}

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
  AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW_API_AUTH_JWT_ISSUER}
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_API_USERNAME}:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
  INSIGHTOPS_DB_HOST: postgres
  INSIGHTOPS_DB_PORT: 5432
  INSIGHTOPS_DB_USER: ${POSTGRES_USER}
  INSIGHTOPS_DB_PASSWORD: ${POSTGRES_PASSWORD}
  INSIGHTOPS_DB_NAME: ${POSTGRES_DB}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: 8123
  CLICKHOUSE_DB: ${CLICKHOUSE_DB}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

x-airflow-common-volumes: &airflow-common-volumes
  - ./dags:/opt/airflow/dags
  - ./logs:/opt/airflow/logs
  - ./plugins:/opt/airflow/plugins
  - ./uploads:/opt/airflow/uploads
  - airflow_config:/opt/airflow/config

services:
  postgres:
    image: postgres:17-alpine
    container_name: insightops_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend-migrate:
    <<: *backend-common
    container_name: insightops_backend_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - alembic
      - upgrade
      - head

  clickhouse-init:
    <<: *backend-common
    container_name: insightops_clickhouse_init
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    command:
      - python
      - -m
      - scripts.create_clickhouse_tables

  backend:
    <<: *backend-common
    container_name: insightops_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
      clickhouse-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8000/health',
          timeout=2
          )
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  airflow-postgres:
    image: postgres:17-alpine
    container_name: insightops_airflow_postgres
    restart: always
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          pg_isready
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  airflow-init:
    <<: *airflow-image
    container_name: insightops_airflow_init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      AIRFLOW_API_USERNAME: ${AIRFLOW_API_USERNAME}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD}
    user: "${AIRFLOW_UID}:0"
    volumes: *airflow-common-volumes
    command:
      - bash
      - -c
      - >
        python /opt/airflow/init_simple_auth.py
        && airflow version

  airflow-webserver:
    <<: *airflow-image
    container_name: insightops_airflow_webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    user: "${AIRFLOW_UID}:0"
    ports:
      - "8080:8080"
    volumes: *airflow-common-volumes
    command: api-server

  airflow-scheduler:
    <<: *airflow-image
    container_name: insightops_airflow_scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    user: "${AIRFLOW_UID}:0"
    volumes: *airflow-common-volumes
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-image
    container_name: insightops_airflow_dag_processor
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    user: "${AIRFLOW_UID}:0"
    volumes: *airflow-common-volumes
    command: dag-processor

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.13.31
    container_name: insightops_clickhouse
    restart: always
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test:
        - CMD-SHELL
        - >
          clickhouse-client
          --user "$${CLICKHOUSE_USER}"
          --password "$${CLICKHOUSE_PASSWORD}"
          --query "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  postgres_data:
  airflow_postgres_data:
  clickhouse_data:
  clickhouse_logs:
  airflow_config:
